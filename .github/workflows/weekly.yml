name: weekly
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+)
        run: |
          if ! pnpm audit --audit-level=high; then
            echo "::error title=pnpm audit::high 이상 취약점 발견. 'pnpm audit --fix update' 로 lockfile 을 갱신하세요."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  report:
    needs: [audit, test]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const title = `weekly check failed: ${new Date().toISOString().slice(0, 10)}`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "weekly" });
            if (open.some(i => i.title === title)) return;
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              `- audit: ${process.env.AUDIT_RESULT}`,
              `- test/build/e2e: ${process.env.TEST_RESULT}`,
            ].join("\n");
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["weekly"] });
